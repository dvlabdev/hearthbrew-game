name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # No dependencies to install: the project is no-build (plain ES modules + Node's built-in test runner).
      - name: Tests
        run: npm test
      - name: Full simulations (economy, haul dominance)
        run: |
          npm run sim:economy
          npm run sim:haul
      # Same script as locally (tools/typecheck.mjs); in CI it runs the pinned TypeScript through npx.
      - name: Type check (TypeScript over JSDoc)
        run: npm run typecheck
