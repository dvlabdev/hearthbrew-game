<title>Hearthbrew Herb Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a meadow patch for a 360px phone. Shopping list on top, 3x4 plants, an inspection card that slides up from the bottom. Candlelit palette (design/art-direction.md). */
:root{
  --bg:#111915; --surface:#19241D; --sunk:#0C120F; --ink:#EEE7D7; --muted:#A8A597; --line:#EEE7D722;
  --moss:#86A976; --moss-dk:#3F5A37; --leaf:#5E8F4E; --leaf-dk:#40663A; --grey-leaf:#8FA58A; --plum:#C99BD2; --amber:#F0A63A; --wisp:#5FD3C7;
  --petal:#F4F0E2; --yolk:#F2C94C; --lilac:#B49BE0; --lav:#9C7CC9; --berry:#C4453B; --root-dk:#7A4A20; --good:#2BC08E; --bad:#EE7A3C;
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --hand:"Kalam", "Comic Sans MS", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:12px 40px}
.app{max-width:440px;margin:0 auto;display:grid;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
h1{font-size:1.5rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wisp);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.hand{font-family:var(--hand);color:var(--plum);line-height:1.35}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{margin-right:auto}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;min-height:44px;background:transparent;font-variant-numeric:tabular-nums}

.list{background:var(--surface);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.list h2{font-size:1.1rem}
.need{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center}
.need svg{width:32px;height:32px}
.need .n{font-variant-numeric:tabular-nums;font-weight:700}
.need.done .n{color:var(--good)}
.basket{display:flex;gap:4px}
.basket i{width:16px;height:16px;border-radius:50%;border:2px solid var(--amber)}
.basket i.full{background:var(--amber)}

.patch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#16221A;border-radius:16px;padding:8px}
.plant{aspect-ratio:1;border:1.5px solid transparent;border-radius:12px;background:#1E2C21;padding:2px;position:relative;min-width:0}
.plant svg{width:100%;height:100%;display:block}
.plant.picked{opacity:.35}
.plant .mark{position:absolute;right:6px;top:4px;font-weight:700;font-size:1.1rem}
.plant .mark.ok{color:var(--good)} .plant .mark.no{color:var(--bad)}
.plant.sel{border-color:var(--amber)}

.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--amber);border-radius:20px 20px 0 0;z-index:10;max-height:88vh;overflow-y:auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet .inner{max-width:440px;margin:0 auto;display:grid;gap:10px}
.insp{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.insp svg{width:120px;height:120px;background:#1E2C21;border-radius:12px}
.clue{display:grid;gap:2px}
.clue b{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary{background:var(--plum);color:var(--bg);border:0;border-radius:14px;padding:12px;font-weight:700;font-size:1.05rem;min-height:52px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:48px}
.guide{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.guide header{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px;border-bottom:1.5px solid var(--line)}
.guide .inner{max-width:440px;margin:0 auto;display:grid;gap:14px}
.entry{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.entry svg{width:64px;height:64px;background:#1E2C21;border-radius:10px}
.entry.new{outline:2px solid var(--amber);outline-offset:4px;border-radius:10px}
.toast{background:var(--sunk);border-left:3px solid var(--plum);padding:10px 12px;border-radius:8px}
.panel{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:10px;border:2px solid var(--amber)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700}
.rate button[aria-pressed="true"]{background:var(--amber);color:var(--bg);border-color:var(--amber)}
textarea{width:100%;min-height:190px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:15px/1.4 var(--body)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}}
</style>

<div class="app" id="app"></div>
<div id="layer"></div>

<script>
(() => {
  // ---------- plant data (look-alikes are harmless: see CLAUDE.md guardrails) ----------
  const P = {
    chamomile:  { name: 'Chamomile', useful: true, flower: 'White petals around a domed, raised yellow centre.', leaf: 'Fine, feathery leaves.', scent: 'Sweet, like green apples.',
                  guide: 'Domed centre, apple scent. If the centre is flat or it smells sour, leave it.' },
    mayweed:    { name: 'Mayweed', look: 'chamomile', flower: 'White petals around a flat, darker yellow centre.', leaf: 'Fine, feathery leaves.', scent: 'Sour and unpleasant.',
                  guide: 'Chamomile’s idle cousin. Flat centre, sour smell. Useless in a pot.' },
    nettle:     { name: 'Nettle', useful: true, flower: 'No showy flowers, just drooping green catkins.', leaf: 'Toothed, pointed leaves covered in tiny stinging hairs.', scent: 'Green and grassy.',
                  guide: 'Toothed leaves that sting, green catkins hanging down. Wear gloves.' },
    deadnettle: { name: 'White dead-nettle', look: 'nettle', flower: 'White, hooded flowers in rings around the stem.', leaf: 'Toothed, pointed leaves, soft and hairless. It does not sting.', scent: 'Faint and honeyed.',
                  guide: 'Looks like nettle, but white hooded flowers and no sting. Bees love it; your pot won’t.' },
    mint:       { name: 'Mint', useful: true, flower: 'A lilac spike at the very top.', leaf: 'Smooth, spear-shaped leaves on a square stem.', scent: 'Sharp, cool mint.',
                  guide: 'Square stem, spear leaves, lilac spike on top, and that cool smell.' },
    groundivy:  { name: 'Ground-ivy', look: 'mint', flower: 'Small purple flowers tucked where the leaves meet the stem.', leaf: 'Round, scalloped leaves on creeping runners.', scent: 'Musty, not minty.',
                  guide: 'Creeps along the ground with round scalloped leaves. Musty, not minty.' },
    sage:       { name: 'Sage', useful: true, flower: 'None this early.', leaf: 'Soft grey-green oval leaves, velvety to touch.', scent: 'Warm and savoury.',
                  guide: 'Grey-green velvet leaves. Hard to mistake.' },
    lavender:   { name: 'Lavender', useful: true, rare: true, flower: 'Purple spikes on long grey stems.', leaf: 'Narrow grey leaves.', scent: 'Clean and calming.',
                  guide: 'A rare find in the meadow. Purple spikes, grey stems, that calming smell.' },
    rosehip:    { name: 'Rosehip', useful: true, rare: true, flower: 'The petals are gone; bright red hips remain.', leaf: 'Small toothed leaves on a thorny stem.', scent: 'Faintly fruity.',
                  guide: 'Red hips on a thorny stem. A late bush still bearing fruit.' },
  };
  const RUNS = [
    { list: { chamomile: 2, nettle: 1, mint: 1 }, patch: { chamomile: 3, mayweed: 3, nettle: 2, mint: 2, sage: 1, lavender: 1 } },
    { list: { nettle: 2, chamomile: 1, sage: 1 }, patch: { nettle: 3, deadnettle: 3, chamomile: 2, mayweed: 2, sage: 1, rosehip: 1 } },
    { list: { mint: 2, nettle: 1, chamomile: 1 }, patch: { mint: 3, groundivy: 3, nettle: 2, deadnettle: 1, chamomile: 1, mayweed: 1, lavender: 1 } },
  ];
  const START_GUIDE = ['chamomile', 'nettle', 'mint', 'sage'];
  const PICKS = 6, KEY = 'hearthbrew-herbwalk-v1';

  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function layout(runIdx, seed) {
    const r = rng(seed), arr = [];
    for (const [k, n] of Object.entries(RUNS[runIdx].patch)) for (let i = 0; i < n; i++) arr.push(k);
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }
  const fresh = () => ({ run: 0, guide: START_GUIDE.slice(), newGuide: [], results: [], answers: '', ...startRun(0) });
  function startRun(i) { const seed = (Date.now() % 100000) + i; return { run: i, plants: layout(i, seed), picked: [], inspected: [], t0: 0, t1: 0, sel: -1, toast: '', done: false, rating: 0, showGuide: false }; }
  let S;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); return v && v.plants ? v : null; } catch (e) { return null; } };

  const app = document.getElementById('app'), layer = document.getElementById('layer');
  const pic = (k, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#p-${k}"/></svg>`;
  const got = k => S.picked.filter(i => S.plants[i] === k).length;

  function render() {
    save();
    if (S.run >= RUNS.length) return renderReport();
    const R = RUNS[S.run];
    const list = Object.entries(R.list).map(([k, n]) => `<div class="need${got(k) >= n ? ' done' : ''}">${pic(k)}<span>${P[k].name}</span><span class="n">${Math.min(got(k), n)} / ${n}</span></div>`).join('');
    const left = PICKS - S.picked.length;
    app.innerHTML = `
      <div class="row"><h1 class="grow">Herb walk</h1><span class="pill">Walk ${S.run + 1} / ${RUNS.length}</span></div>
      <section class="list"><div class="row"><h2 class="grow">Wren's list</h2><button type="button" class="pill" id="open-guide">Field guide</button></div>${list}
        <div class="row"><span class="grow muted">Basket</span><span class="basket" aria-label="${left} picks left">${Array.from({ length: PICKS }, (_, k) => `<i class="${k < S.picked.length ? 'full' : ''}"></i>`).join('')}</span></div></section>
      ${S.toast ? `<p class="toast hand">${S.toast}</p>` : ''}
      <div class="patch" aria-label="Meadow patch">${S.plants.map((k, i) => {
        const p = S.picked.includes(i), ok = p && P[k].useful;
        return `<button type="button" class="plant${p ? ' picked' : ''}${S.sel === i ? ' sel' : ''}" data-i="${i}" aria-label="${p ? P[k].name + (ok ? ', picked' : ', wrong pick') : 'Unknown plant ' + (i + 1) + ', tap to inspect'}" ${p || S.done ? 'disabled' : ''}>${pic(k)}${p ? `<span class="mark ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</span>` : ''}</button>`;
      }).join('')}</div>
      ${S.done ? endPanel() : `<button type="button" class="ghost" id="home">Head home now</button>`}`;
    app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => inspect(+b.dataset.i));
    document.getElementById('open-guide').onclick = () => { S.showGuide = true; renderLayer(); };
    const home = document.getElementById('home'); if (home) home.onclick = finish;
    if (S.done) bindEnd();
    renderLayer();
  }

  function inspect(i) {
    if (!S.t0) S.t0 = Date.now();
    S.sel = i; if (!S.inspected.includes(i)) S.inspected.push(i);
    render();
  }

  function renderLayer() {
    if (S.showGuide) {
      layer.innerHTML = `<section class="guide" aria-label="Field guide"><div class="inner">
        <header><h2>Wren's field guide</h2><button type="button" class="pill" id="close-guide">Close</button></header>
        ${S.guide.map(k => `<div class="entry${S.newGuide.includes(k) ? ' new' : ''}">${pic(k)}<div><b>${P[k].name}</b>${P[k].useful ? '' : ' <span class="muted">(look-alike)</span>'}<p class="hand">${P[k].guide}</p></div></div>`).join('')}
        <p class="muted">Pick the wrong plant and Wren will add it here, with how to tell it apart.</p></div></section>`;
      document.getElementById('close-guide').onclick = () => { S.showGuide = false; S.newGuide = []; render(); };
      return;
    }
    if (S.sel < 0 || S.done) { layer.innerHTML = ''; return; }
    const k = S.plants[S.sel], p = P[k], left = PICKS - S.picked.length;
    const known = S.guide.includes(k) && !p.look ? '' : '';
    layer.innerHTML = `<section class="sheet" aria-label="Inspect plant"><div class="inner">
      <div class="insp">${pic(k)}<div style="display:grid;gap:8px;min-width:0">
        <div class="clue"><b>Flower</b><span>${p.flower}</span></div>
        <div class="clue"><b>Leaf and stem</b><span>${p.leaf}</span></div>
        <div class="clue"><b>Scent</b><span>${p.scent}</span></div></div></div>
      <div class="btns"><button type="button" class="ghost" id="leave">Leave it</button><button type="button" class="primary" id="pickit" ${left ? '' : 'disabled'}>Pick (${left} left)</button></div>
    </div></section>${known}`;
    document.getElementById('leave').onclick = () => { S.sel = -1; render(); };
    document.getElementById('pickit').onclick = () => doPick(S.sel);
    document.getElementById('pickit').focus();
  }

  function doPick(i) {
    const k = S.plants[i];
    S.picked.push(i); S.sel = -1; S.toast = '';
    if (!P[k].useful) {
      const real = P[P[k].look].name;
      S.toast = `That's ${P[k].name}, not ${real}. ${P[k].guide} — W.`;
      if (!S.guide.includes(k)) { S.guide.push(k); S.newGuide.push(k); }
    } else if (P[k].rare) {
      S.toast = `A rare find: ${P[k].name}! Not on the list, but the shop will be glad of it.`;
      if (!S.guide.includes(k)) { S.guide.push(k); S.newGuide.push(k); }
    }
    if (S.picked.length >= PICKS) return finish();
    render();
  }

  function finish() { if (!S.t0) S.t0 = Date.now(); S.t1 = Date.now(); S.done = true; S.sel = -1; render(); window.scrollTo({ top: document.body.scrollHeight }); }

  function summary() {
    const R = RUNS[S.run];
    const listDone = Object.entries(R.list).filter(([k, n]) => got(k) >= n).length;
    const wrong = S.picked.filter(i => !P[S.plants[i]].useful).length;
    const rare = S.picked.filter(i => P[S.plants[i]].rare).length;
    return { listDone, listTotal: Object.keys(R.list).length, wrong, rare, secs: Math.max(1, Math.round((S.t1 - S.t0) / 1000)), inspected: S.inspected.length };
  }
  function endPanel() {
    const s = summary();
    return `<section class="panel" aria-live="polite"><h2>${s.listDone === s.listTotal ? 'List complete!' : 'Back to the shop'}</h2>
      <p>List: ${s.listDone} of ${s.listTotal} done · wrong picks: ${s.wrong} · rare finds: ${s.rare} · ${s.secs} s</p>
      <p>Would you play this again tomorrow?</p>
      <div class="rate" role="group" aria-label="Rating 1 to 5">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-rate="${v}" aria-pressed="${S.rating === v}">${v}</button>`).join('')}</div>
      <p class="muted" style="font-size:.9rem">1 = no thanks · 5 = yes, gladly</p>
      <button type="button" class="primary" id="nextrun" ${S.rating ? '' : 'disabled'}>${S.run >= RUNS.length - 1 ? 'See my results' : 'Next walk'}</button></section>`;
  }
  function bindEnd() {
    app.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { S.rating = +b.dataset.rate; render(); });
    const nx = document.getElementById('nextrun');
    if (nx) nx.onclick = () => {
      S.results.push({ walk: S.run + 1, ...summary(), rating: S.rating });
      const next = S.run + 1;
      if (next >= RUNS.length) { S.run = next; return render(); }
      Object.assign(S, startRun(next)); S.toast = ''; render(); window.scrollTo({ top: 0 });
    };
  }

  function renderReport() {
    layer.innerHTML = '';
    const R = S.results, med = a => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
    const report = `Hearthbrew prototype C2 (herb walk) results\nMedian walk time: ${med(R.map(x => x.secs))} s · walk 3 rating: ${R[2] ? R[2].rating : '-'}\n` +
      R.map(x => `Walk ${x.walk}: ${x.secs}s, list ${x.listDone}/${x.listTotal}, wrong ${x.wrong}, rare ${x.rare}, inspected ${x.inspected}, rated ${x.rating}/5`).join('\n') +
      `\n\nIn your own words:\n1. How did you decide what to pick? \n2. Did any look-alike feel unfair? Which? \n3. Was it satisfying to learn the difference? \n4. Would this work as your morning routine in the game? \n`;
    app.innerHTML = `<div class="row"><h1 class="grow">Herb walk</h1></div>
      <section class="panel"><h2>Three walks done</h2>
      <table><thead><tr><th>Walk</th><th>Time</th><th>List</th><th>Wrong</th><th>Rating</th></tr></thead><tbody>
      ${R.map(x => `<tr><td>${x.walk}</td><td>${x.secs}s</td><td>${x.listDone}/${x.listTotal}</td><td>${x.wrong}</td><td>${x.rating}/5</td></tr>`).join('')}</tbody></table>
      <p>Add your answers at the bottom, then copy everything and paste it back to Claude.</p>
      <label for="rep" class="muted">Your results</label><textarea id="rep"></textarea>
      <button type="button" class="primary" id="copy">Copy results</button><p class="muted" id="copied" aria-live="polite"></p>
      <button type="button" class="ghost" id="again">Start over</button></section>`;
    const ta = document.getElementById('rep'); ta.value = S.answers || report;
    ta.oninput = () => { S.answers = ta.value; save(); };
    document.getElementById('copy').onclick = () => {
      const out = document.getElementById('copied'), fb = () => { ta.focus(); ta.select(); out.textContent = 'Selected. Use your phone’s Copy.'; };
      try { navigator.clipboard.writeText(ta.value).then(() => { out.textContent = 'Copied.'; }, fb); } catch (e) { fb(); }
    };
    document.getElementById('again').onclick = () => { S = fresh(); render(); };
  }

  function start(data) { S = (data && data.S) || load() || fresh(); render(); }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
