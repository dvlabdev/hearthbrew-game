<title>Hearthbrew Foraging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one screen per run for a 360px phone. Area tabs, basket counter, the grid, then the haul. Candlelit palette (design/art-direction.md). */
:root{
  --bg:#111915; --surface:#19241D; --sunk:#0C120F; --ink:#EEE7D7; --muted:#A8A597; --line:#EEE7D722;
  --moss:#86A976; --moss-dk:#3F5A37; --plum:#C99BD2; --amber:#F0A63A; --wisp:#5FD3C7; --petal:#F4F0E2;
  --root:#B57E43; --root-dk:#7A4A20; --glow:#6FF5E3; --berry:#C4453B; --lav:#9C7CC9; --blueberry:#5B6FC9;
  --rock:#3A3F3B; --rock-hi:#575E58; --salt:#E8E4DA; --sulfur:#E2C93A; --heat:#EE7A3C;
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --hand:"Kalam", "Comic Sans MS", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:12px 40px}
.app{max-width:440px;margin:0 auto;display:grid;gap:14px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
h1{font-size:1.5rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wisp);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.hand{font-family:var(--hand);color:var(--plum)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .grow{margin-right:auto}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.tabs button{background:transparent;border:0;padding:8px 4px;min-height:48px;line-height:1.2;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.basket{display:flex;gap:4px;align-items:center}
.basket i{width:16px;height:16px;border-radius:50%;border:2px solid var(--amber)}
.basket i.full{background:var(--amber)}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;min-height:44px;background:transparent;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;padding:8px;border-radius:16px;background:var(--surface);touch-action:manipulation}
.grid.cave{background:#070A08}
.tile{aspect-ratio:1;border:0;padding:0;border-radius:10px;background:transparent;position:relative;min-width:0;display:grid;place-items:center}
.tile svg{width:100%;height:100%;display:block}
.tile.picked{cursor:default}
.tile .item{position:absolute;inset:10%;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.tile.dark svg.bg{opacity:.18}
.tile.dark{background:transparent}
.tile.lit{box-shadow:inset 0 0 0 2px #F0A63A55}
.glint{position:absolute;right:8%;top:6%;width:30%;height:30%;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
.rustle{animation:rustle .55s ease-in-out 2}
@keyframes rustle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateX(-2px)}75%{transform:rotate(9deg) translateX(2px)}}
@media (prefers-reduced-motion: reduce){.glint,.tile .item{animation:none}.glint{opacity:.9}.rustle{animation:none;outline:3px dashed var(--amber);outline-offset:-3px}}

.haul{display:flex;gap:6px;flex-wrap:wrap;min-height:40px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 2px;border-radius:999px;background:var(--surface);font-size:.95rem;font-variant-numeric:tabular-nums}
.chip svg{width:30px;height:30px}
.chip.rare{box-shadow:inset 0 0 0 2px var(--glow)}
.panel{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:10px;border:2px solid var(--amber)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700}
.rate button[aria-pressed="true"]{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.primary{background:var(--plum);color:var(--bg);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem;min-height:52px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:44px}
textarea{width:100%;min-height:170px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:15px/1.4 var(--body)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

  <symbol id="i-chamomile" viewBox="0 0 100 100"><g transform="translate(50 50)" stroke="var(--ink)" stroke-width="2" fill="var(--petal)"><ellipse rx="8" ry="20" cy="-20"/><ellipse rx="8" ry="20" cy="-20" transform="rotate(60)"/><ellipse rx="8" ry="20" cy="-20" transform="rotate(120)"/><ellipse rx="8" ry="20" cy="-20" transform="rotate(180)"/><ellipse rx="8" ry="20" cy="-20" transform="rotate(240)"/><ellipse rx="8" ry="20" cy="-20" transform="rotate(300)"/><circle r="12" fill="var(--amber)"/></g></symbol>

  <symbol id="i-sage" viewBox="0 0 100 100"><g stroke="var(--ink)" stroke-width="2" fill="#8FA58A"><ellipse cx="34" cy="60" rx="11" ry="24" transform="rotate(-38 34 60)"/><ellipse cx="66" cy="56" rx="11" ry="24" transform="rotate(38 66 56)"/><ellipse cx="50" cy="28" rx="10" ry="20"/></g></symbol>
  <symbol id="i-nettle" viewBox="0 0 100 100"><g fill="var(--moss)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"><path d="M50 84 L40 80 L43 74 L33 70 L37 64 L26 59 L33 53 L24 46 C42 44 50 60 50 84Z"/><path d="M50 84 L60 80 L57 74 L67 70 L63 64 L74 59 L67 53 L76 46 C58 44 50 60 50 84Z"/><path d="M50 48 L44 44 L47 38 L41 34 L46 30 L43 22 L49 21 L50 12 L52 21 L58 22 L54 30 L59 34 L53 38 L56 44Z"/></g></symbol>
  <symbol id="i-fireroot" viewBox="0 0 100 100"><g stroke="var(--ink)" stroke-width="2" fill="var(--root)"><ellipse cx="46" cy="58" rx="30" ry="18" transform="rotate(-18 46 58)"/><ellipse cx="26" cy="42" rx="12" ry="16" transform="rotate(-40 26 42)"/><ellipse cx="64" cy="34" rx="11" ry="17" transform="rotate(25 64 34)"/></g><ellipse cx="80" cy="62" rx="6" ry="7" fill="var(--heat)" stroke="var(--ink)" stroke-width="2"/></symbol>
  <symbol id="i-lavender" viewBox="0 0 100 100"><path d="M50 94 V20" stroke="var(--moss)" stroke-width="3"/><g fill="var(--lav)" stroke="var(--ink)" stroke-width="1.6"><ellipse cx="50" cy="18" rx="7" ry="9"/><ellipse cx="43" cy="32" rx="7" ry="9"/><ellipse cx="57" cy="32" rx="7" ry="9"/><ellipse cx="44" cy="48" rx="7" ry="9"/><ellipse cx="56" cy="48" rx="7" ry="9"/></g></symbol>
  <symbol id="i-rosehip" viewBox="0 0 100 100"><ellipse cx="40" cy="60" rx="20" ry="26" fill="var(--berry)" stroke="var(--ink)" stroke-width="2" transform="rotate(-12 40 60)"/><ellipse cx="66" cy="56" rx="15" ry="20" fill="var(--berry)" stroke="var(--ink)" stroke-width="2" transform="rotate(14 66 56)"/><path d="M36 36 l-6-8 M40 34 l0-10 M44 36 l6-8" stroke="var(--root-dk)" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-bilberry" viewBox="0 0 100 100"><g fill="var(--blueberry)" stroke="var(--ink)" stroke-width="2"><circle cx="36" cy="58" r="15"/><circle cx="62" cy="56" r="15"/><circle cx="50" cy="34" r="15"/></g><g fill="var(--petal)" opacity=".5"><circle cx="31" cy="53" r="3"/><circle cx="57" cy="51" r="3"/><circle cx="45" cy="29" r="3"/></g></symbol>
  <symbol id="i-pine" viewBox="0 0 100 100"><rect x="30" y="8" width="40" height="84" rx="8" fill="var(--root-dk)" stroke="var(--ink)" stroke-width="2"/><path d="M38 20 v20 M50 14 v14 M62 30 v24 M42 60 v22" stroke="#5A3516" stroke-width="3"/><path d="M50 44 C60 56 62 66 50 76 C38 66 40 56 50 44Z" fill="var(--amber)" stroke="var(--ink)" stroke-width="2"/></symbol>

  <symbol id="i-none" viewBox="0 0 100 100"><path d="M30 60 q10-14 20 0 q10-14 20 0" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="app" id="app"></div>

<script>
(() => {
  const AREAS = {
    meadow: { name: 'Meadow', n: 5, ground: 'g-bush', picks: 6,
      common: ['chamomile', 'mint', 'sage', 'nettle', 'fireroot'], rare: ['lavender', 'rosehip'],
      flavor: 'Bees hum over the meadow. Herbs here like company.' },
    forest: { name: 'Whisperwood', n: 6, ground: 'g-fern', picks: 6,
      common: ['bilberry', 'pine', 'mint', 'nettle'], roots: ['valerian', 'angelica'], rare: ['glowcap'],
      flavor: 'The Whisperwood never keeps still. Listen to it.' },
    cave: { name: 'Under the Hill', n: 6, ground: 'g-rock', picks: 6,
      veins: ['salt', 'quartz'], common: ['brimstone'],
      flavor: 'Your lantern throws a small circle of light. The hill hides its treasures in seams.' },
  };
  const NAMES = { chamomile: 'Chamomile', mint: 'Mint', sage: 'Sage', nettle: 'Nettle', fireroot: 'Fireroot', lavender: 'Lavender', rosehip: 'Rosehip',
    bilberry: 'Bilberry', pine: 'Pine resin', glowcap: 'Glowcap', valerian: 'Valerian', angelica: 'Angelica', salt: 'Salt', quartz: 'Quartz', brimstone: 'Brimstone' };
  const RARE = new Set(['lavender', 'rosehip', 'glowcap', 'quartz']);
  const KEY = 'hearthbrew-forage-v1';

  // ---------- seeded random ----------
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const pick = (r, a) => a[Math.floor(r() * a.length)];
  const nbrs = (n, i) => { const x = i % n, y = Math.floor(i / n), out = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < n && Y < n) out.push(Y * n + X); } return out; };
  const ortho = (n, i) => nbrs(n, i).filter(j => j % n === i % n || Math.floor(j / n) === Math.floor(i / n));

  // ---------- board generation ----------
  function makeBoard(area, seed) {
    const A = AREAS[area], n = A.n, r = rng(seed), cells = Array(n * n).fill(null);
    if (area === 'cave') {
      for (const kind of A.veins) {               // veins: random orthogonal walks
        let i = Math.floor(r() * n * n), len = kind === 'quartz' ? 3 : 5;
        for (let k = 0; k < len; k++) { if (!cells[i]) cells[i] = kind; const o = ortho(n, i).filter(j => !cells[j]); if (!o.length) break; i = pick(r, o); }
      }
      for (let k = 0; k < 3; k++) { const i = Math.floor(r() * n * n); if (!cells[i]) cells[i] = 'brimstone'; }
      return { cells, rareNodes: [] };
    }
    const clusters = area === 'meadow' ? 3 : 4;
    for (let c = 0; c < clusters; c++) {          // herb clusters: neighbours of a find likely match
      const herb = area === 'forest' && c === clusters - 1 ? pick(r, A.roots) : pick(r, A.common);
      const center = Math.floor(r() * n * n); cells[center] = herb;
      for (const j of nbrs(n, center)) if (!cells[j] && r() < 0.5) cells[j] = herb;
    }
    for (let i = 0; i < n * n; i++) if (!cells[i] && r() < 0.08) cells[i] = pick(r, A.common);
    const empties = cells.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    const rareNodes = [];
    for (let k = 0; k < 2 && empties.length; k++) {
      const i = empties.splice(Math.floor(r() * empties.length), 1)[0];
      cells[i] = pick(r, A.rare); rareNodes.push(i);
    }
    return { cells, rareNodes };
  }

  // ---------- state ----------
  const fresh = () => ({ run: 1, area: 'meadow', seed: Date.now() % 100000, results: [], answers: '', ...newRun('meadow', Date.now() % 100000) });
  function newRun(area, seed) {
    const b = makeBoard(area, seed), n = AREAS[area].n;
    return { area, seed, cells: b.cells, rareNodes: b.rareNodes, picked: [], picksLeft: AREAS[area].picks, last: area === 'cave' ? (n - 1) * n + Math.floor(n / 2) : -1,
      t0: 0, t1: 0, rating: 0, rustle: [], done: false };
  }
  let S;
  function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); return v && v.cells ? v : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // ---------- render ----------
  const app = document.getElementById('app');
  const ico = id => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
  function lit(i) {
    if (S.area !== 'cave') return true;
    const n = AREAS.cave.n, L = S.last;
    return Math.abs(i % n - L % n) <= 1 && Math.abs(Math.floor(i / n) - Math.floor(L / n)) <= 1;
  }
  function render() {
    save();
    if (S.run > 5 && S.done === 'report') return renderReport();
    const A = AREAS[S.area], n = A.n;
    const tiles = S.cells.map((c, i) => {
      const p = S.picked.includes(i), isLit = lit(i);
      const showItem = p || (S.area === 'cave' && isLit && c);
      const glint = S.area === 'meadow' && !p && S.rareNodes.includes(i) ? '<svg class="glint" aria-hidden="true"><use href="#spark"/></svg>' : '';
      const bg = p ? 'g-empty' : A.ground;
      const label = p ? (c ? `${NAMES[c]}, picked` : 'Nothing here') : showItem ? `${NAMES[c]}, unpicked` : 'Hidden';
      return `<button type="button" class="tile${p ? ' picked' : ''}${S.area === 'cave' ? (isLit ? ' lit' : ' dark') : ''}${S.rustle.includes(i) ? ' rustle' : ''}" data-i="${i}" aria-label="${label}" ${p || S.done ? 'disabled' : ''}>
        <svg class="bg" aria-hidden="true"><use href="#${bg}"/></svg>${showItem ? `<span class="item">${ico(c || 'none')}</span>` : p ? `<span class="item">${ico('none')}</span>` : ''}${glint}</button>`;
    }).join('');
    const haul = {}; S.picked.forEach(i => { const c = S.cells[i]; if (c) haul[c] = (haul[c] || 0) + 1; });
    const chips = Object.entries(haul).map(([k, v]) => `<span class="chip${RARE.has(k) ? ' rare' : ''}">${ico(k)}${NAMES[k]} ×${v}</span>`).join('') || '<span class="muted">Your basket is empty.</span>';
    app.innerHTML = `
      <div class="row"><h1 class="grow">Foraging</h1><span class="pill" aria-label="Run ${Math.min(S.run, 5)} of 5">Run ${Math.min(S.run, 5)} / 5</span></div>
      <div class="tabs" role="group" aria-label="Area">${Object.entries(AREAS).map(([k, a]) => `<button type="button" data-area="${k}" aria-pressed="${S.area === k}" ${S.picked.length && !S.done ? 'disabled' : ''}>${a.name}</button>`).join('')}</div>
      <p class="hand">${A.flavor}</p>
      <div class="row"><span class="grow muted">Basket</span><span class="basket" aria-label="${S.picksLeft} picks left">${Array.from({ length: A.picks }, (_, k) => `<i class="${k < A.picks - S.picksLeft ? 'full' : ''}"></i>`).join('')}</span></div>
      <div class="grid ${S.area === 'cave' ? 'cave' : ''}" style="--n:${n}">${tiles}</div>
      <div class="haul" aria-live="polite">${chips}</div>
      ${S.done ? endPanel(haul) : ''}`;
    app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => tap(+b.dataset.i));
    app.querySelectorAll('[data-area]').forEach(b => b.onclick = () => { if (S.picked.length && !S.done) return; Object.assign(S, newRun(b.dataset.area, Date.now() % 100000)); render(); });
    if (S.done) bindEnd();
  }

  function tap(i) {
    if (S.done || S.picked.includes(i) || S.picksLeft <= 0) return;
    if (!S.t0) S.t0 = Date.now();
    S.picked.push(i); S.picksLeft--; S.last = i; S.rustle = [];
    if (S.area === 'forest') wander();
    if (S.picksLeft === 0) { S.t1 = Date.now(); S.done = true; }
    render();
  }

  // forest twist: one hidden rare node moves to a neighbouring hidden tile; both tiles rustle
  function wander() {
    const n = AREAS.forest.n, r = rng(S.seed + S.picked.length * 31);
    const live = S.rareNodes.filter(i => !S.picked.includes(i));
    if (!live.length) return;
    const from = pick(r, live);
    const to = nbrs(n, from).filter(j => !S.picked.includes(j) && !S.cells[j]);
    if (!to.length) return;
    const dest = pick(r, to);
    S.cells[dest] = S.cells[from]; S.cells[from] = null;
    S.rareNodes = S.rareNodes.map(x => x === from ? dest : x);
    S.rustle = [from, dest];
  }

  function endPanel(haul) {
    const secs = Math.max(1, Math.round((S.t1 - S.t0) / 1000));
    const rares = Object.keys(haul).filter(k => RARE.has(k)).length;
    return `<section class="panel" aria-live="polite">
      <h2>Basket full</h2>
      <p>${Object.values(haul).reduce((a, b) => a + b, 0)} items in ${secs} s${rares ? `, including ${rares} rare find${rares > 1 ? 's' : ''}` : ''}.</p>
      <p>Would you play this again tomorrow?</p>
      <div class="rate" role="group" aria-label="Rating 1 to 5">${[1, 2, 3, 4, 5].map(v => `<button type="button" data-rate="${v}" aria-pressed="${S.rating === v}">${v}</button>`).join('')}</div>
      <p class="muted" style="font-size:.9rem">1 = no thanks · 5 = yes, gladly</p>
      <button type="button" class="primary" id="nextrun" ${S.rating ? '' : 'disabled'}>${S.run >= 5 ? 'See my results' : 'Next run'}</button>
    </section>`;
  }
  function bindEnd() {
    app.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { S.rating = +b.dataset.rate; render(); });
    const nx = document.getElementById('nextrun');
    if (nx) nx.onclick = () => {
      const haul = {}; S.picked.forEach(i => { const c = S.cells[i]; if (c) haul[c] = (haul[c] || 0) + 1; });
      S.results.push({ run: S.run, area: S.area, secs: Math.round((S.t1 - S.t0) / 1000), items: Object.values(haul).reduce((a, b) => a + b, 0),
        rare: Object.keys(haul).filter(k => RARE.has(k)).length, rating: S.rating });
      S.run++;
      if (S.run > 5) { S.done = 'report'; return render(); }
      const suggested = ['meadow', 'meadow', 'forest', 'cave', S.area][S.run - 1];
      Object.assign(S, newRun(suggested, Date.now() % 100000));
      render(); window.scrollTo({ top: 0 });
    };
  }

  function renderReport() {
    const R = S.results;
    const med = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
    const report = `Hearthbrew prototype C (foraging) results\nMedian run time: ${med(R.map(x => x.secs))} s · run 5 rating: ${R[4] ? R[4].rating : '-'}\n` +
      R.map(x => `Run ${x.run} ${AREAS[x.area].name}: ${x.secs}s, ${x.items} items, ${x.rare} rare, rated ${x.rating}/5`).join('\n') +
      `\n\nIn your own words (no right answers):\n1. What did the meadow's sparkles and herb groups tell you? \n2. What was happening in the Whisperwood when bushes shook? \n3. How did you find things in the dark cave? \n4. Anything annoying or confusing? \n`;
    app.innerHTML = `
      <div class="row"><h1 class="grow">Foraging</h1></div>
      <section class="panel">
        <h2>Five runs done</h2>
        <table><thead><tr><th>Run</th><th>Area</th><th>Time</th><th>Items</th><th>Rating</th></tr></thead><tbody>
        ${R.map(x => `<tr><td>${x.run}</td><td>${AREAS[x.area].name}</td><td>${x.secs}s</td><td>${x.items}${x.rare ? ' (+' + x.rare + ' rare)' : ''}</td><td>${x.rating}/5</td></tr>`).join('')}</tbody></table>
        <p>Add your answers at the bottom, then copy everything and paste it back to Claude.</p>
        <label for="rep" class="muted">Your results</label>
        <textarea id="rep"></textarea>
        <button type="button" class="primary" id="copy">Copy results</button>
        <p class="muted" id="copied" aria-live="polite"></p>
        <button type="button" class="ghost" id="again">Start over</button>
      </section>`;
    const ta = document.getElementById('rep');
    ta.value = S.answers || report;
    ta.oninput = () => { S.answers = ta.value; save(); };
    document.getElementById('copy').onclick = () => {
      const out = document.getElementById('copied');
      const fb = () => { ta.focus(); ta.select(); out.textContent = 'Selected. Use your phone’s Copy.'; };
      try { navigator.clipboard.writeText(ta.value).then(() => { out.textContent = 'Copied.'; }, fb); } catch (e) { fb(); }
    };
    document.getElementById('again').onclick = () => { S = fresh(); render(); };
  }

  function start(data) { S = (data && data.S) || load() || fresh(); render(); }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
