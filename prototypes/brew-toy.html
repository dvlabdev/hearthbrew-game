<title>Hearthbrew Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one-column shop counter for a 360px phone. Customer on top, workbench in the middle, shelf below; the Notebook slides over everything. */
:root{
  /* Whisperwood Dusk, Candlelit = primary (design/art-direction.md) */
  --bg:#111915; --surface:#19241D; --sunk:#0C120F; --ink:#EEE7D7; --muted:#A8A597; --line:#EEE7D722;
  --moss:#86A976; --plum:#C99BD2; --amber:#F0A63A; --wisp:#5FD3C7; --iron:#0A0C0B; --iron-hi:#3A3F3B;
  --petal:#F4F0E2; --skin:#C8916B; --skin2:#A9714F; --hair:#4A2D1A; --grey-hair:#BDB6A6; --root:#B57E43; --root-dk:#7A4A20; --glow:#6FF5E3; --berry:#C4453B; --lav:#9C7CC9;
  --heat:#EE7A3C; --calm:#56B4E9; --vigor:#2BC08E; --clarity:#E29BC8; --on-trait:#111915;
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --hand:"Kalam", "Comic Sans MS", cursive;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#E9ECDF; --surface:#F6F6EE; --sunk:#DDE2D2; --ink:#2C1F31; --muted:#5D5464; --line:#2C1F3126;
  --moss:#3E5C38; --plum:#6A3A6D; --amber:#B86A10; --wisp:#1B7F7B; --iron:#2A2830; --iron-hi:#4A4752;
  --petal:#FBF9F0; --skin:#D9A47E; --skin2:#B98262; --hair:#5E3A22; --grey-hair:#9C9488; --root:#C48A4C; --root-dk:#8A5527; --glow:#3FD3C2; --berry:#B0362C; --lav:#7A57AE;
  --heat:#C4520A; --calm:#0A6FAE; --vigor:#007F5B; --clarity:#A64C89; --on-trait:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:12px 40px}
.app{max-width:440px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wisp);outline-offset:2px;border-radius:8px}
.hand{font-family:var(--hand);color:var(--plum);line-height:1.35}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .title{font-family:var(--display);font-size:1.35rem;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;min-height:44px;background:transparent;font-variant-numeric:tabular-nums}
.pill.coins{color:var(--amber);border-color:transparent;padding-inline:4px;font-weight:700}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.progress i{height:6px;border-radius:3px;background:var(--sunk)}
.progress i.done{background:var(--amber)}
.progress i.now{background:var(--plum)}

/* riddle */
.riddle{background:var(--surface);border-radius:18px;padding:14px;display:grid;grid-template-columns:68px minmax(0,1fr);gap:12px;align-items:start}
.riddle svg{width:68px;height:68px}
.riddle .who{font-family:var(--display);font-size:1.2rem}
.riddle .tier{font-size:.85rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.riddle q{display:block;quotes:"“" "”";font-size:1.05rem;line-height:1.45;margin-top:4px}
.kw{border-bottom:2.5px solid var(--kc,var(--muted));padding-bottom:1px}
.kw .tb{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-left:2px}
.int{border-bottom:2px dotted var(--muted)}

/* bench */
.bench{display:grid;grid-template-columns:minmax(84px,30%) minmax(0,1fr);gap:10px;align-items:center}
.bench .pot{width:100%;height:auto}
.slots{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.slot{aspect-ratio:1;border:2px dashed var(--muted);border-radius:12px;background:transparent;display:grid;place-items:center;padding:4px;min-height:48px;min-width:0}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--surface)}
.slot svg{width:82%;height:82%}
.heat{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.heat button{background:transparent;border:0;padding:8px;min-height:48px;display:grid;gap:0;line-height:1.2}
.heat button small{color:var(--muted);font-size:.8rem}
.heat button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.heat button[aria-pressed="true"] small{color:var(--bg);opacity:.75}

/* meter */
.meter{display:grid;gap:6px;background:var(--surface);border-radius:14px;padding:10px 12px}
.meter .cap{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.mrow{display:grid;grid-template-columns:22px 58px minmax(0,1fr) 32px;gap:6px;align-items:center}
.mrow svg{width:22px;height:22px}
.mrow .nm{font-size:15px}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:14px}
.bar i{border-radius:3px;background:var(--sunk)}
.bar i.on{background:var(--c)}
.bar i.unk{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 6px)}
.mrow .val{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ing{display:grid;justify-items:center;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 2px 4px;min-height:44px;font-size:13px;line-height:1.15;min-width:0}
.ing svg{width:36px;height:36px}
.ing .tags{display:flex;gap:2px;justify-content:center;min-height:14px}
.ing .tags svg{width:13px;height:13px}
.ing small{color:var(--muted);font-size:11px}

.act{display:grid;gap:10px}
.primary{background:var(--plum);color:var(--bg);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem;min-height:52px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:44px}

/* result */
.result{background:var(--surface);border-radius:18px;padding:14px;display:grid;gap:8px;border:2px solid var(--amber)}
.stars{font-size:1.6rem;letter-spacing:.12em;color:var(--amber);line-height:1}
.result .say{font-size:1.05rem}
.result .coin{color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums}
.note{font-family:var(--hand);color:var(--plum);font-size:1.05rem;line-height:1.35;border-left:2px solid var(--plum);padding-left:10px}
.learn{font-size:.95rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.learn svg{width:16px;height:16px}

/* notebook sheet */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.sheet .inner{max-width:440px;margin:0 auto;display:grid;gap:16px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{font-size:1.6rem}
.sheet h3{font-size:1.15rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.nb-ing{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}
.nb-ing svg.ic{width:40px;height:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 4px;border-radius:999px;background:var(--sunk);font-size:.9rem;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
.list{display:grid;gap:10px}
.kwrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kwrow b{font-weight:700}

details.dev{border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px}
details.dev summary{cursor:pointer;color:var(--muted);min-height:32px}
details.dev pre{white-space:pre-wrap;font-size:13px;margin:8px 0 0;font-family:ui-monospace,Consolas,monospace;overflow-x:auto}

.end{display:grid;gap:12px}
.end table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.end td,.end th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.end textarea{width:100%;min-height:150px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:15px/1.4 var(--body)}

/* cauldron */
.pot *{transform-box:fill-box}
.flames{transform-origin:50% 100%;transform:scale(.62);transition:transform .5s ease}
.pot.boil .flames{transform:scale(1.18,1.32)}
.flame{transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate}
.flame.f2{animation-duration:.9s;animation-delay:-.3s}
.pot.boil .flame{animation-duration:.28s}
@keyframes flick{from{transform:scaleY(.86) scaleX(1.04)}to{transform:scaleY(1.1) scaleX(.95)}}
.bub{opacity:0;animation:rise 3.4s ease-in infinite}
.bub.b2{animation-delay:-1.7s}
.pot.boil .bub{animation:pop .7s ease-in infinite}
.bub.b3{animation-delay:-.2s}.bub.b4{animation-delay:-.45s}.bub.b5{animation-delay:-.1s}.bub.b6{animation-delay:-.55s}
@keyframes rise{0%{transform:translateY(3px) scale(.6);opacity:0}40%{opacity:.8}100%{transform:translateY(-4px) scale(1);opacity:0}}
@keyframes pop{0%{transform:translateY(4px) scale(.5);opacity:0}30%{opacity:1}80%{transform:translateY(-8px) scale(1.3);opacity:.9}100%{transform:translateY(-10px) scale(1.6);opacity:0}}
.splash{opacity:0}
.pot.boil .splash{animation:splash .9s ease-out infinite}
.splash.p2{animation-delay:-.3s}.splash.p3{animation-delay:-.6s}
@keyframes splash{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),20px);opacity:0}}
.steam{opacity:0;stroke-width:3;animation:steam 6s ease-in-out infinite}
.steam.s2{animation-delay:-3s}
.pot.boil .steam{stroke-width:9;animation:billow 1.8s ease-out infinite}
.pot.boil .steam.s2{animation-delay:-.9s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}50%{opacity:.35}100%{transform:translateY(-22px);opacity:0}}
@keyframes billow{0%{transform:translateY(10px) scale(.8);opacity:0}30%{opacity:.85}100%{transform:translateY(-40px) scale(1.6,1.2);opacity:0}}
.liquid{transform-origin:50% 50%;transition:fill .4s}
.pot.boil .liquid{animation:heave .32s ease-in-out infinite alternate}
@keyframes heave{from{transform:scale(1,1)}to{transform:scale(1.02,1.45)}}
.potbody{transform-origin:50% 100%}
.pot.boil .potbody{animation:shake .14s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.2px,.6px)}50%{transform:translate(1px,-.6px)}75%{transform:translate(-.6px,-.4px)}}
.boilonly{display:none}
.pot.boil .boilonly{display:inline}
@media (prefers-reduced-motion: reduce){
  .flame,.bub,.steam,.splash,.liquid,.potbody,.pot.boil .bub,.pot.boil .steam,.pot.boil .splash,.pot.boil .liquid,.pot.boil .potbody,.pot.boil .flame{animation:none}
  .bub,.steam{opacity:.6}.pot.boil .splash{opacity:.8}}
</style>

<script>
(() => {
  // ---------------- data (mirrors design/data/content.json + riddles-toy.json) ----------------
  const TRAITS = [
    { id: 'heat', name: 'Heat', adj: 'warming' }, { id: 'calm', name: 'Calm', adj: 'soothing' },
    { id: 'vigor', name: 'Vigor', adj: 'strengthening' }, { id: 'clarity', name: 'Clarity', adj: 'clearing' }];
  const TCOL = ['var(--heat)', 'var(--calm)', 'var(--vigor)', 'var(--clarity)'];
  const ING = {
    chamomile: { name: 'Chamomile', vec: [0,3,0,0],  tags: ['delicate'], wren: 'Pure calm. Steep it gently.' },
    lavender:  { name: 'Lavender',  vec: [0,2,0,1],  tags: ['delicate'], wren: 'Calming, with a breath of clear air.' },
    mint:      { name: 'Mint',      vec: [-2,1,0,2], tags: ['delicate'], wren: 'Cools the blood: it takes heat away. Clears the head.' },
    sage:      { name: 'Sage',      vec: [0,1,0,3],  tags: [],           wren: 'A clear head in a leaf. Sturdy; heat won’t hurt it.' },
    fireroot:  { name: 'Fireroot',  vec: [3,0,1,0],  tags: ['tough'],    wren: 'The warming root. Give it a proper boil.' },
    nettle:    { name: 'Nettle',    vec: [1,0,3,0],  tags: [],           wren: 'Strength for tired limbs. A little warming too.' },
    rosehip:   { name: 'Rosehip',   vec: [0,0,2,1],  tags: ['tough'],    wren: 'Hedge fruit for the weary. Tough skin.' },
    honey:     { name: 'Honey',     vec: [0,1,1,0],  tags: [],           wren: 'Sweet and kind. Softens anything fiery.' },
  };
  const ORDER = ['chamomile','lavender','mint','sage','fireroot','nettle','rosehip','honey'];
  // Wren's starter notes: fully known. Meadow finds: only the strongest trait known until brewed.
  const START_KNOWN = { chamomile: 1, mint: 1, sage: 1, fireroot: 1, honey: 1 };

  // keyword glossary: traits revealed in the Notebook once decoded (2 stars or better)
  const KW = {
    'sleep': ['calm'], 'chilled': ['heat'], 'chilled to the bone': ['heat'], 'frosty': ['heat'],
    "head's in a fog": ['clarity'], 'foggy': ['clarity'], 'worn out': ['vigor'], 'tossing all night': ['calm'],
    'stiff': ['vigor', 'heat'], 'shake': ['calm', 'clarity'], 'sniffle': ['clarity', 'heat'],
    'upset stomach': ['calm', 'vigor'], 'restless': ['calm'], 'aches': ['vigor', 'heat'],
    'nothing too fiery': ['no heat'],
  };

  const PEOPLE = {

  // ---------------- state ----------------

  // ---------------- brewing (design/brew-math.md, rules R1 R2 R3 R4 R7) ----------------
  function mainTrait(v) { return v.reduce((m, x, i) => x > v[m] ? i : m, 0); }
  function brew(names, boil, knownOnly) {
    const s = [0,0,0,0], unknown = [false,false,false,false], fired = new Set();
    for (const n of names) {
      const ing = ING[n], v = ing.vec.slice();
      if (ing.tags.includes('delicate') && boil) {
        if (v[1] > 0) { v[1]--; fired.add('R1'); }
        if (v[3] > 0) { v[3]--; fired.add('R1'); }
      }
      if (ing.tags.includes('tough') && !boil) { v[mainTrait(v)]--; fired.add('R2'); }
      v.forEach((x, i) => { if (knownOnly && !S.known[n][i]) { if (ING[n].vec[i] !== 0) unknown[i] = true; return; } s[i] += x; });
    }
    if (names.includes('honey') && names.some(n => ING[n].vec[0] > 0)) { s[1]++; fired.add('R4'); }
    if (boil && s[0] >= 8) { for (let i = 1; i < 4; i++) s[i]--; fired.add('R3'); }
    return { vec: s.map(x => Math.max(0, Math.min(10, x))), unknown, fired };
  }
  function score(vec, target, tol) {
    const d = vec.reduce((a, x, i) => a + Math.abs(x - target[i]), 0);
    let st = d <= tol ? 3 : d <= tol + 2 ? 2 : d <= tol + 4 ? 1 : 0;
    const top = vec.slice().sort((a, b) => b - a);
    let harmonized = false;
    if (top[0] === top[1] && top[0] >= 4 && st < 3) { st++; harmonized = true; }
    return { d, st, harmonized };
  }
  function allSolutions(r, slots) {

    const rec = (start, combo) => {
      if (combo.length === slots) {

          const res = brew(names, b, false), sc = score(res.vec, r.target, r.tol);
          if (sc.st === 3) out.push(`${names.join(' + ')} (${b ? 'boil' : 'simmer'}) → [${res.vec}] d${sc.d}`);
        }
        return;
      }
      for (let i = start; i < pool.length; i++) rec(i, combo.concat([pool[i]]));
    };
    rec(0, []);
    return [...new Set(out)];
  }

  function reaction(r, vec, st) {
    const name = PEOPLE[r.who].name;
    // find the biggest miss to give a qualitative hint (never numbers)
    let worst = -1, diff = 0;
    vec.forEach((x, i) => { const dd = x - r.target[i]; if (Math.abs(dd) > Math.abs(diff)) { diff = dd; worst = i; } });
    const hint = worst < 0 || diff === 0 ? '' : diff > 0
      ? ` “It's a bit too ${TRAITS[worst].adj}${r.target[worst] === 0 ? ', and I never asked for that' : ''}.”`
      : ` “I'd hoped for something more ${TRAITS[worst].adj}.”`;
    const lines = [
      `${name} sniffs it, winces, and pays out of kindness.${hint}`,
      `${name} sips. “Mm. It might help a little.”${hint}`,
      `${name} smiles. “That should do nicely.”${st === 2 ? hint.replace('”', ' But thank you.”') : ''}`,
      `${name} breathes it in and sighs with relief. “You're Wren's heir, all right.”`,
    ];
    return lines[st];
  }

  function serve() {
    const r = RIDDLES[S.idx], names = S.slots.filter(Boolean);
    const res = brew(names, S.boil, false), sc = score(res.vec, r.target, r.tol);
    const learned = [], notes = [];
    // reveal unknown ingredient traits
    for (const n of new Set(names)) {
      if (S.known[n].some(k => !k)) {
        S.known[n] = [1,1,1,1];
        const chips = ING[n].vec.map((v, i) => v ? `<span class="chip">${tb(TRAITS[i].id)}${v}</span>` : '').join('');
        learned.push(`Notebook: ${ING[n].name} fully known ${chips}`);
      }
    }
    for (const id of ['R1','R2','R3','R4']) if (res.fired.has(id) && !S.rules.includes(id)) { S.rules.push(id); notes.push(RULE_NOTES[id]); }
    if (sc.harmonized && !S.rules.includes('R7')) { S.rules.push('R7'); notes.push(RULE_NOTES.R7); }
    if (sc.st >= 2) {
      const kws = [...r.text.matchAll(/\{([^}]+)\}/g)].map(m => m[1].toLowerCase()).filter(k => KW[k] && !S.decoded.includes(k));
      for (const k of kws) {
        S.decoded.push(k);
        learned.push(`Decoded “${k}” → ${KW[k].map(t => t === 'no heat' ? 'no Heat' : tb(t) + TRAITS.find(x => x.id === t).name).join(' + ')}`);
      }
    }
    const coins = Math.round(10 * [0.25, 0.6, 1, 1.5][sc.st]);
    S.coins += coins;
    S.results.push({ id: r.id, who: r.who, tier: r.tier, stars: sc.st, d: sc.d, brew: res.vec, names: names.slice(), boil: S.boil, secs: Math.round((Date.now() - S.started) / 1000) });
    S.served = { st: sc.st, say: reaction(r, res.vec, sc.st), coins, learned, notes };
    render();
  }

  function next() {
    if (S.idx >= RIDDLES.length - 1) { S.ended = true; S.served = null; return render(); }
    S.idx++; S.served = null; S.slots = Array(S.slotCount).fill(null); S.boil = false; S.started = Date.now();
    render(); window.scrollTo({ top: 0 });
  }

  function devText(pv) {
    const r = RIDDLES[S.idx];
    const names = S.slots.filter(Boolean);
    const real = names.length ? brew(names, S.boil, false) : null;
    const sc = real ? score(real.vec, r.target, r.tol) : null;
    return `Target [${r.target}]  tol ${r.tol}  (3★ d≤${r.tol}, 2★ d≤${r.tol + 2}, 1★ d≤${r.tol + 4})\n` +
      (real ? `Current brew (true values) [${real.vec}]  d=${sc.d}  → ${sc.st}★\n` : '') +
      `\n3★ solutions with ${S.slotCount} slots:\n` + allSolutions(r, S.slotCount).join('\n');
  }
  function updateDev() { const el = document.getElementById('devpre'); if (el) el.textContent = devText(); }

  function bind() {
    const $ = s => app.querySelector(s);
    $('#open-nb').onclick = openNotebook;
    $('#theme').onclick = () => {
      const root = document.documentElement;
      if (root.dataset.theme === 'light') delete root.dataset.theme; else root.dataset.theme = 'light';
      render();
    };
    app.querySelectorAll('[data-ing]').forEach(b => b.onclick = () => {
      const i = S.slots.indexOf(null); if (i < 0) return;
      S.slots[i] = b.dataset.ing; render();
    });
    app.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { S.slots[+b.dataset.slot] = null; render(); });
    app.querySelectorAll('[data-heat]').forEach(b => b.onclick = () => { S.boil = b.dataset.heat === '1'; render(); });
    const pot = document.getElementById('pot');
    if (pot) {
      pot.classList.toggle('boil', S.boil);
      const pv = brew(S.slots.filter(Boolean), S.boil, true);
      pot.querySelector('.liquid').setAttribute('fill', S.slots.some(Boolean) ? TCOL[mainTrait(pv.vec)] : 'var(--wisp)');
    }
    if ($('#serve')) $('#serve').onclick = serve;
    if ($('#next')) $('#next').onclick = next;
  }

  function openNotebook() {
    const ings = ORDER.map(k => {
      const chips = ING[k].vec.map((v, i) => {
        if (!v) return '';
        return S.known[k][i] ? `<span class="chip">${tb(TRAITS[i].id)}${v > 0 ? v : '−' + Math.abs(v)}</span>` : `<span class="chip">${tb(TRAITS[i].id)}?</span>`;
      }).join('');
      const unknownMore = S.known[k].some((kn, i) => !kn && ING[k].vec[i] !== 0) ? '<span class="chip">… more to learn</span>' : '';
      const tags = ING[k].tags.length ? ` · ${ING[k].tags.join(', ')}` : '';
      return `<div class="nb-ing">${ic(k, 'ic')}<div><b>${ING[k].name}</b><span class="muted">${tags}</span><div class="chips">${chips}${unknownMore}</div>${START_KNOWN[k] || !S.known[k].some(x => !x) ? `<p class="hand">${ING[k].wren}</p>` : '<p class="hand">Found in the meadow. Brew it once to learn the rest.</p>'}</div></div>`;
    }).join('');
    const kws = S.decoded.length ? S.decoded.map(k => `<div class="kwrow"><b>“${k}”</b> → ${KW[k].map(t => t === 'no heat' ? 'no Heat at all' : tb(t, '') + ' ' + TRAITS.find(x => x.id === t).name).join(' + ')}</div>`).join('')
      : '<p class="muted">Serve someone well (two stars or more) to decode the words they used.</p>';
    const rules = S.rules.length ? S.rules.map(id => `<p class="note">${RULE_NOTES[id]}</p>`).join('') : '<p class="muted">None yet. Wren will note each rule the first time it happens in your pot.</p>';
    nb.innerHTML = `<div class="inner">
      <header><h2>Wren's Notebook</h2><button type="button" class="pill" id="close-nb">Close</button></header>
      <section class="list"><h3>Wren's rules of thumb</h3>${WREN_RULES.map(t => `<p class="hand">${t}</p>`).join('')}</section>
      <section class="list"><h3>The four traits</h3>${TRAITS.map(t => `<div class="kwrow">${tb(t.id, '')} <b>${t.name}</b> <span>${TRAIT_USES[t.id]}</span></div>`).join('')}</section>
      <section class="list"><h3>Ingredients</h3>${ings}</section>
      <section class="list"><h3>Words you've decoded</h3>${kws}</section>
      <section class="list"><h3>What the pot taught you</h3>${rules}</section>
      <section class="list"><h3>Workbench</h3><div class="kwrow">Cauldron slots:
        <button type="button" class="pill" data-slots="3" aria-pressed="${S.slotCount === 3}">3</button>
        <button type="button" class="pill" data-slots="4" aria-pressed="${S.slotCount === 4}">4</button></div>
        <button type="button" class="ghost" id="restart">Start the day over</button></section>
    </div>`;
    nb.hidden = false; document.body.style.overflow = 'hidden';
    nb.querySelector('#close-nb').onclick = closeNotebook;
    nb.querySelectorAll('[data-slots]').forEach(b => b.onclick = () => {
      S.slotCount = +b.dataset.slots;
      S.slots = S.slots.slice(0, S.slotCount); while (S.slots.length < S.slotCount) S.slots.push(null);
      openNotebook(); render();
    });
    nb.querySelector('#restart').onclick = () => { S = fresh(); closeNotebook(); render(); };
    nb.querySelector('#close-nb').focus();
  }
  function closeNotebook() { nb.hidden = true; document.body.style.overflow = ''; }

  function renderEnd() {
    const R = S.results, avg = (R.reduce((a, x) => a + x.stars, 0) / R.length).toFixed(2);
    const pct = (t, min) => { const xs = R.filter(x => x.tier === t); return xs.length ? Math.round(100 * xs.filter(x => x.stars >= min).length / xs.length) : 0; };
    const rows = R.map(x => `<tr><td>${x.id}</td><td>${PEOPLE[x.who].name}</td><td>${'★'.repeat(x.stars)}${'☆'.repeat(3 - x.stars)}</td><td>${x.secs}s</td></tr>`).join('');
    const report = `Hearthbrew prototype B results\nAverage stars: ${avg}\nTier 1 at 2★+: ${pct(1, 2)}%  Tier 2 at 2★+: ${pct(2, 2)}%  Tier 3: ${R.filter(x => x.tier === 3).map(x => x.stars + '★').join('')}\n` +
      R.map(x => `#${x.id} ${x.who} t${x.tier}: ${x.stars}★ d${x.d} ${x.secs}s  ${x.names.join('+')} (${x.boil ? 'boil' : 'simmer'}) → [${x.brew}]`).join('\n') +
      `\n\nMy answers:\n1. Did you get an "aha" moment? \n2. Did any riddle feel unfair? Which? \n3. Was the time per riddle OK? \n4. Did you want one more customer? \n`;
    app.innerHTML = `
      <div class="top"><span class="title">Hearthbrew</span><span class="pill coins">◉ ${S.coins}</span></div>
      <section class="end">
        <h2>The shop is closed</h2>
        <p>You served 10 customers and earned <b class="coin" style="color:var(--amber)">${S.coins} coins</b>. Average: <b>${avg} ★</b>.</p>
        <table><thead><tr><th>#</th><th>Customer</th><th>Stars</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table>
        <p>Please add your answers at the bottom, then copy everything and paste it back to Claude.</p>
        <label for="report" class="muted">Your results</label>
        <textarea id="report">${esc(report)}</textarea>
        <button type="button" class="primary" id="copy">Copy results</button>
        <p class="muted" id="copied" aria-live="polite"></p>
        <button type="button" class="ghost" id="again">Play again</button>
      </section>`;
    document.getElementById('copy').onclick = () => {
      const ta = document.getElementById('report'), out = document.getElementById('copied');
      const fallback = () => { ta.focus(); ta.select(); out.textContent = 'Selected. Use your phone’s Copy.'; };
      try { navigator.clipboard.writeText(ta.value).then(() => { out.textContent = 'Copied.'; }, fallback); } catch (e) { fallback(); }
    };
    document.getElementById('again').onclick = () => { S = fresh(); render(); };
  }

  // ---------------- boot (keeps progress across republishes in an open viewer) ----------------
  function start(data) {
    S = data && data.S ? data.S : fresh();
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
